<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khulna News</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
  <div class="container-fluid bg-dark text-danger py-2">
  <div class="row align-items-center">

    <!-- Left column: contact info -->
    <div class="col-md-6 d-flex flex-wrap gap-3">
      <div class="d-flex align-items-center">
        <i class="bi bi-envelope-fill me-2"></i>
        <a href="mailto:info@khulnaweb.com" class="link-danger text-decoration-none">info@khulnaweb.com</a>
      </div>
      <div class="d-flex align-items-center">
        <i class="bi bi-telephone-fill me-2"></i>
        <a href="tel:+01784566987" class="link-danger text-decoration-none">+01784566987</a>
      </div>
    </div>

    <!-- Right column: social icons -->
    <div class="col-md-6 d-flex justify-content-md-end gap-3 mt-2 mt-md-0">
      <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="link-danger">
        <i class="bi bi-facebook"></i>
      </a>
      <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" class="link-danger">
        <i class="bi bi-twitter"></i>
      </a>
      <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="link-danger">
        <i class="bi bi-linkedin"></i>
      </a>
      <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="link-danger">
        <i class="bi bi-youtube"></i>
      </a>
    </div>

  </div>
</div>

  <div class="container-fluid">
    <div class="row">
      <div class="col col-2 text-bg-danger p-2 fs-3">
        News Headline
      </div>
      <div class="col col-lg-10 text-bg-info p-2">
        <marquee behavior="scroll" direction="left" scrollamount="15">
          <div class="d-flex flex-row">
            <div class="p-2"><i class="bi bi-newspaper"></i> item 1</div>
            <div class="p-2"><i class="bi bi-newspaper"></i> item 2</div>
            <div class="p-2"><i class="bi bi-newspaper"></i> item 3</div>
          </div>
        </marquee>
      </div>
    </div>
  </div>

  <div id="carouselExampleSlidesOnly" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&h=600&fit=crop" class="d-block w-100" alt="Mountain landscape">
      </div>
      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200&h=600&fit=crop" class="d-block w-100" alt="Forest path">
      </div>
      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1200&h=600&fit=crop" class="d-block w-100" alt="Ocean waves">
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
